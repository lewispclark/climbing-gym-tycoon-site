name: Climbing Gym Tycoon feedback
description: Report a problem or suggest an improvement.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Climbing Gym Tycoon. Please do not include payment details, passwords, or anything else private.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - Something is broken
        - An idea or improvement
        - A question
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened, or what would you like to see?
      description: For a bug, include what you did and what you expected to happen.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: e.g. iPhone 15, iOS 26.1
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots are useful, but please remove personal information first.
